<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CasFlou - Cargando...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .loading {
      text-align: center;
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #0066cc;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading">
    <div class="spinner"></div>
    <p>Iniciando CasFlou...</p>
  </div>

  <script>
    // Prevent redirect loops - check current location
    const currentPath = window.location.pathname;

    // If already on a specific page, don't redirect
    if (currentPath !== '/' && currentPath !== '/index.html') {
      console.log('Already on page:', currentPath);
    } else {
      // Only redirect from root
      const hasToken = localStorage.getItem('casflou_session');
      const target = hasToken ? '/queue' : '/login';

      console.log('Redirecting from / to', target);
      window.location.replace(target);
    }
  </script>
</body>
</html>
