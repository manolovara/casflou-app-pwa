<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CasFlou - Panel de Control</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0066cc">
</head>
<body>
  <header class="app-header">
    <h1>📊 Panel de Control</h1>
    <div style="display: flex; gap: 0.5rem; align-items: center;">
      <a href="/queue" class="icon-btn" title="Volver a la Cola">📋</a>
      <a href="/settings" class="icon-btn" title="Configuración">⚙️</a>
      <span id="env-badge" style="font-size: 0.7rem; padding: 2px 6px; background: #eee; border-radius: 3px; color: #666;"></span>
      <button class="icon-btn" id="logout-btn" title="Cerrar sesión">🚪</button>
    </div>
  </header>

  <div id="dashboard-container">
    <div class="skeleton-card" style="height: 200px;"></div>
    <div class="skeleton-card" style="height: 300px; margin-top: 1rem;"></div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    // Auth guard
    if (!localStorage.getItem('casflou_session')) {
      window.location.href = '/login.html';
    }

    // Load environment badge
    const config = getConfig();
    document.getElementById('env-badge').textContent = `🌍 ${config.name}`;

    // Load dashboard
    async function loadDashboard() {
      try {
        const token = localStorage.getItem('casflou_session');
        const response = await fetch(apiUrl('/api/dashboard'), {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (response.ok) {
          const html = await response.text();
          const container = document.getElementById('dashboard-container');
          container.innerHTML = html;
        } else {
          throw new Error('Failed to load');
        }
      } catch (error) {
        console.error('Dashboard load error:', error);
        const container = document.getElementById('dashboard-container');
        container.innerHTML = '<div style="padding: 2rem; color: red; text-align: center;">Error cargando dashboard</div>';
      }
    }

    // Initial load
    loadDashboard();

    // Reload every 60 seconds
    setInterval(loadDashboard, 60000);

    // Logout
    document.getElementById('logout-btn').addEventListener('click', async () => {
      const token = localStorage.getItem('casflou_session');
      await fetch(apiUrl('/api/auth/logout'), {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}` }
      }).catch(() => {});

      localStorage.removeItem('casflou_session');
      localStorage.removeItem('casflou_user');
      window.location.href = '/login.html';
    });

    // Register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }

    console.log(`🌍 Dashboard loaded with: ${config.name} (${config.description})`);
  </script>
</body>
</html>
