<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CasFlou - Facturas pendientes de cobro</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0066cc">
</head>
<body>
  <header class="app-header">
    <div style="display: flex; flex-direction: column; flex: 1;">
      <h1>Facturas pendientes de cobro</h1>
      <div style="font-size: 1.5rem; font-weight: 700; color: #0066cc; margin-top: 0.5rem;" id="total">€0,00</div>
    </div>
    <div style="display: flex; gap: 0.5rem; align-items: center;">
      <a href="/dashboard.html" class="icon-btn" title="Panel de control">📊</a>
      <a href="/debtors.html" class="icon-btn" title="Clientes">👥</a>
      <a href="/invoices.html" class="icon-btn" title="Facturas">📄</a>
      <a href="/settings.html" class="icon-btn" title="Configuración" style="display: none;" id="settings-nav">⚙️</a>
      <button class="icon-btn" id="logout-btn" title="Cerrar sesión">🚪</button>
    </div>
  </header>

  <div id="queue-container">
    <div id="loading" class="skeleton-list htmx-indicator">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>
  </div>

  <!-- Tone Selector Modal -->
  <div id="tone-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>🎯 Selecciona el tono del mensaje</h3>
        <button class="modal-close" id="tone-close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <p style="margin-bottom: 1rem; color: #666;">Elige cómo quieres que suene el mensaje:</p>
        <div class="tone-options">
          <button class="tone-btn" data-tone="cordial">
            <div class="tone-icon">😊</div>
            <div class="tone-name">Cordial</div>
            <div class="tone-desc">Amable y personal</div>
            <small style="display:block; margin-top:0.25rem;">Ej: "Esperamos recibir tu pago. ¡Gracias!"</small>
          </button>
          <button class="tone-btn" data-tone="balanced">
            <div class="tone-icon">📋</div>
            <div class="tone-name">Equilibrado</div>
            <div class="tone-desc">Profesional y claro</div>
            <small style="display:block; margin-top:0.25rem;">Ej: "Solicitamos el pago de la factura..."</small>
          </button>
          <button class="tone-btn" data-tone="formal">
            <div class="tone-icon">⚖️</div>
            <div class="tone-name">Formal</div>
            <div class="tone-desc">Serio y urgente</div>
            <small style="display:block; margin-top:0.25rem;">Ej: "Requerimos el pago inmediato..."</small>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Snooze Modal -->
  <div id="snooze-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>⏸️ Posponer esta factura</h3>
        <button class="modal-close" id="snooze-close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <!-- Quick snooze buttons -->
        <div class="snooze-quick">
          <p style="margin: 0 0 0.5rem 0; font-size: 0.875rem; color: #666;">Opción rápida:</p>
          <button class="snooze-btn" data-days="7">1 Semana</button>
          <button class="snooze-btn" data-days="14">2 Semanas</button>
          <button class="snooze-btn" data-days="30">1 Mes</button>
        </div>

        <!-- Or use date picker -->
        <div class="form-group">
          <label for="snooze-date">O elige una fecha:</label>
          <input type="date" id="snooze-date" class="form-input" />
        </div>

        <!-- Reason dropdown -->
        <div class="form-group">
          <label for="snooze-reason">Motivo (obligatorio):</label>
          <select id="snooze-reason" class="form-input">
            <option value="">Selecciona un motivo...</option>
          </select>
        </div>

        <!-- Custom reason input (hidden by default) -->
        <div class="form-group" id="custom-reason-wrapper" style="display: none;">
          <label for="snooze-custom-reason">Nuevo motivo:</label>
          <input type="text" id="snooze-custom-reason" class="form-input" placeholder="Describe el motivo..." />
        </div>

        <!-- Reminder text -->
        <div class="form-group">
          <label for="snooze-reminder">Nota para el seguimiento (opcional):</label>
          <textarea id="snooze-reminder" class="form-input" rows="2" placeholder="Ej: Llamar al tesorero el lunes..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="snooze-cancel-btn">Cancelar</button>
        <button class="btn-primary" id="snooze-confirm-btn">Posponer</button>
      </div>
    </div>
  </div>

  <!-- Log Action Modal -->
  <div id="log-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>📝 Registrar acción de contacto</h3>
        <button class="modal-close" id="log-close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <!-- Action Type -->
        <div class="form-group">
          <label for="log-action">Tipo de contacto:</label>
          <select id="log-action" class="form-input">
            <option value="">Selecciona...</option>
            <option value="CALL">📞 Llamada telefónica</option>
            <option value="EMAIL">📧 Email</option>
            <option value="WHATSAPP">💬 WhatsApp</option>
            <option value="SMS">📱 SMS</option>
            <option value="VISIT">🏢 Visita en persona</option>
            <option value="OTHER">📌 Otro</option>
          </select>
        </div>

        <!-- Outcome -->
        <div class="form-group">
          <label for="log-outcome">Resultado:</label>
          <select id="log-outcome" class="form-input">
            <option value="">Selecciona...</option>
            <option value="PROMISE_GIVEN">✅ Promesa de pago recibida</option>
            <option value="PAYMENT_RECEIVED">💰 Pago recibido</option>
            <option value="NO_RESPONSE">🚫 Sin respuesta</option>
            <option value="PROMISED_BROKEN">⚠️ Promesa rota</option>
            <option value="PARTIAL_PAYMENT">💵 Pago parcial</option>
            <option value="OTHER">📌 Otro</option>
          </select>
        </div>

        <!-- Promised Date (shown only if outcome is PROMISE_GIVEN) -->
        <div class="form-group" id="promised-date-wrapper" style="display: none;">
          <label for="log-promised-date">Fecha prometida (obligatorio):</label>
          <input type="date" id="log-promised-date" class="form-input" />
        </div>

        <!-- Notes -->
        <div class="form-group">
          <label for="log-notes">Notas (opcional):</label>
          <textarea id="log-notes" class="form-input" rows="3" placeholder="Ej: Cliente dice que pagará cuando cobre de su cliente..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="log-cancel-btn">Cancelar</button>
        <button class="btn-primary" id="log-confirm-btn">Registrar</button>
      </div>
    </div>
  </div>

  <!-- Draft Message Modal -->
  <div id="draft-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>💬 Preparar Mensaje</h3>
        <button class="modal-close" id="draft-close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <!-- Tone Selection (Step 1) -->
        <div id="draft-tone-selection" style="display: block;">
          <p style="margin-bottom: 1rem; color: #666;">Selecciona el tono para el mensaje:</p>
          <div class="tone-options">
            <button class="tone-btn draft-tone-btn" data-tone="cordial">
              <div class="tone-icon">😊</div>
              <div class="tone-name">Cordial</div>
              <div class="tone-desc">Amable y colaborativo</div>
            </button>
            <button class="tone-btn draft-tone-btn" data-tone="balanced">
              <div class="tone-icon">📋</div>
              <div class="tone-name">Equilibrado</div>
              <div class="tone-desc">Profesional y claro</div>
            </button>
            <button class="tone-btn draft-tone-btn" data-tone="formal">
              <div class="tone-icon">⚖️</div>
              <div class="tone-name">Formal</div>
              <div class="tone-desc">Serio y urgente</div>
            </button>
          </div>
        </div>

        <!-- Draft Display (Step 2) -->
        <div id="draft-display" style="display: none;">
          <div style="margin-bottom: 1rem;">
            <p style="font-size: 0.9rem; color: #666; margin: 0 0 0.75rem 0;"><strong>Mensaje preparado:</strong></p>
            <textarea id="draft-message-text" style="width: 100%; min-height: 120px; padding: 0.75rem; border: 1px solid #ddd; border-radius: 6px; font-size: 0.95rem; line-height: 1.6; font-family: inherit;" placeholder="Mensaje..."></textarea>
          </div>

          <p style="font-size: 0.85rem; color: #999; margin: 0.75rem 0 1rem 0;">
            Tono: <strong id="draft-tone-label"></strong>
            <button id="draft-change-tone" style="margin-left: 1rem; background: none; border: none; color: #0066cc; text-decoration: underline; cursor: pointer; padding: 0; font-size: 0.85rem;">cambiar tono</button>
            <button id="draft-regenerate" style="margin-left: 1rem; background: none; border: none; color: #0066cc; text-decoration: underline; cursor: pointer; padding: 0; font-size: 0.85rem;">🔄 regenerar</button>
          </p>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="modal-footer" id="draft-actions" style="display: none;">
        <button id="draft-whatsapp-btn" class="btn-primary" style="text-decoration: none; display: inline-block;">
          📱 Enviar por WhatsApp
        </button>
        <a id="draft-register-link" href="" class="btn-secondary" style="text-decoration: none; display: inline-block;">
          📝 Registrar
        </a>
        <button class="btn-secondary" id="draft-cancel-btn">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/auth.js"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <script>
    // Auth guard - check session first
    function checkAuth() {
      if (!localStorage.getItem('casflou_session')) {
        window.location.href = '/login.html';
        return false;
      }
      return true;
    }

    // Load saved environment preference
    const savedEnv = localStorage.getItem('casflou-env');
    if (savedEnv && (savedEnv === 'development' || savedEnv === 'production')) {
      ENV.ACTIVE = savedEnv;
    }

    // Display current environment
    const config = getConfig();
    const envBadge = document.getElementById('env-badge');
    if (envBadge) {
      envBadge.textContent = `🌍 ${config.name}`;
    }

    // Check auth before proceeding
    if (!checkAuth()) {
      // Exit if not authenticated
      throw new Error('Unauthorized');
    }

    // Configure HTMX if available
    if (window.htmx) {
      console.log('✓ HTMX loaded');
      htmx.config.defaultIndicatorStyle = 'spinner';
      htmx.config.refreshOnHistoryMiss = true;

      // Configure HTMX to add auth headers
      document.addEventListener('htmx:configRequest', (event) => {
        event.detail.headers['Authorization'] = `Bearer ${localStorage.getItem('casflou_session')}`;
      });

      // Handle log response for auto-advance
      document.addEventListener('htmx:afterRequest', (event) => {
        if (event.detail.xhr.responseURL.includes('/api/log')) {
          try {
            const response = JSON.parse(event.detail.xhr.responseText);
            if (response.ok && response.next_invoice_id) {
              // Auto-scroll to next invoice card after a brief delay
              setTimeout(() => {
                const nextCard = document.querySelector(`[data-invoice-id='${response.next_invoice_id}']`);
                if (nextCard) {
                  nextCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                  nextCard.style.outline = '3px solid #0066cc';
                  setTimeout(() => {
                    nextCard.style.outline = 'none';
                  }, 2000);
                }
              }, 300);
            }
          } catch (e) {
            // Not JSON, ignore
          }
        }
      });
    } else {
      console.warn('⚠️ HTMX not loaded');
    }

    // ═════════════════════════════════════════════════════════════════
    // QUEUE LOADING (works with or without HTMX)
    // ═════════════════════════════════════════════════════════════════
    const queueUrl = apiUrl('/api/queue');
    console.log('📨 Queue URL:', queueUrl);

    const queueContainer = document.getElementById('queue-container');

    async function loadQueue() {
      try {
        const token = localStorage.getItem('casflou_session');
        const response = await fetch(queueUrl, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (response.ok) {
          const html = await response.text();
          queueContainer.innerHTML = html;
          updateTotal();
          console.log('✓ Queue loaded');
        } else {
          console.error('Queue load failed:', response.status);
          queueContainer.innerHTML = '<div style="padding: 1rem; color: red;">Error loading queue</div>';
        }
      } catch (error) {
        console.error('Queue load error:', error);
        queueContainer.innerHTML = '<div style="padding: 1rem; color: red;">Error loading queue: ' + error.message + '</div>';
      }
    }

    // Initial load
    loadQueue();

    // Reload every 30 seconds
    setInterval(loadQueue, 30000);

    // ═════════════════════════════════════════════════════════════════
    // BUTTON EVENT LISTENERS (Always active, regardless of HTMX)
    // ═════════════════════════════════════════════════════════════════

    // Snooze modal logic
    let currentSnoozeInvoiceId = null;

    // ─────── TONE SELECTOR LOGIC ─────────
    let currentToneDraftInvoiceId = null;

    function openToneModal(invoiceId) {
      console.log('📝 Opening tone modal for invoice:', invoiceId);
      currentToneDraftInvoiceId = invoiceId;
      const modal = document.getElementById('tone-modal');
      if (modal) {
        modal.style.display = 'flex';
        console.log('✓ Tone modal opened');
      } else {
        console.error('❌ Tone modal not found');
      }
    }

    function closeToneModal() {
      document.getElementById('tone-modal').style.display = 'none';
      currentToneDraftInvoiceId = null;
    }

    // ─────── DRAFT MESSAGE MODAL LOGIC ─────────
    let currentDraftInvoiceId = null;
    let currentDraftDebtorId = null;
    let currentDraftWhatsapp = null;
    let currentDraftMessage = null;

    function openDraftModal(invoiceId, debtorId) {
      console.log('💬 Opening draft modal for invoice:', invoiceId);
      currentDraftInvoiceId = invoiceId;
      currentDraftDebtorId = debtorId;
      const modal = document.getElementById('draft-modal');
      if (modal) {
        modal.style.display = 'flex';
        document.getElementById('draft-tone-selection').style.display = 'block';
        document.getElementById('draft-display').style.display = 'none';
        document.getElementById('draft-actions').style.display = 'none';
      }
    }

    function closeDraftModal() {
      const modal = document.getElementById('draft-modal');
      if (modal) {
        modal.style.display = 'none';
      }
      currentDraftInvoiceId = null;
      currentDraftDebtorId = null;
      currentDraftWhatsapp = null;
      currentDraftMessage = null;
    }

    // Draft tone button listeners
    document.querySelectorAll('.draft-tone-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const tone = e.currentTarget.dataset.tone;
        if (!currentDraftInvoiceId) return;

        console.log('Fetching draft with tone:', tone);
        const token = localStorage.getItem('casflou_session');
        const apiBaseUrl = localStorage.getItem('casflou_api_url') ||
                          (window.location.hostname === 'localhost' ? 'http://localhost:8790' : window.location.origin);

        try {
          const response = await fetch(apiBaseUrl + '/api/draft?invoice_id=' + currentDraftInvoiceId + '&tone=' + tone, {
            headers: { 'Authorization': 'Bearer ' + token }
          });

          if (!response.ok) throw new Error('Failed to load draft');

          const html = await response.text();
          const tempDiv = document.createElement('div');
          tempDiv.innerHTML = html;
          const draftForm = tempDiv.querySelector('.draft-form');

          if (draftForm) {
            // Extract message from the draft form - it's in a paragraph with italic style
            const messagePara = Array.from(draftForm.querySelectorAll('p')).find(p => p.style.fontStyle === 'italic' || p.className === 'message');
            const message = messagePara?.textContent?.trim() || 'No message generated';
            const whatsappNumber = draftForm.dataset.whatsapp || '';

            // Store for action buttons
            currentDraftMessage = message;
            currentDraftWhatsapp = whatsappNumber;

            // Display draft (in editable textarea)
            document.getElementById('draft-message-text').value = message;
            document.getElementById('draft-tone-label').textContent = tone.charAt(0).toUpperCase() + tone.slice(1);

            // Set action button handlers
            document.getElementById('draft-register-link').href = '/log.html?invoice_id=' + currentDraftInvoiceId + '&debtor_id=' + currentDraftDebtorId;

            // Show draft and actions
            document.getElementById('draft-tone-selection').style.display = 'none';
            document.getElementById('draft-display').style.display = 'block';
            document.getElementById('draft-actions').style.display = 'flex';
          }
        } catch (error) {
          console.error('Error loading draft:', error);
          alert('Error al cargar el mensaje');
        }
      });
    });

    // Draft modal close handlers
    document.getElementById('draft-close-btn')?.addEventListener('click', closeDraftModal);
    document.getElementById('draft-cancel-btn')?.addEventListener('click', closeDraftModal);
    document.getElementById('draft-change-tone')?.addEventListener('click', () => {
      document.getElementById('draft-tone-selection').style.display = 'block';
      document.getElementById('draft-display').style.display = 'none';
      document.getElementById('draft-actions').style.display = 'none';
    });

    // Regenerate draft button
    document.getElementById('draft-regenerate')?.addEventListener('click', async () => {
      const textarea = document.getElementById('draft-message-text');
      const tone = document.getElementById('draft-tone-label').textContent.toLowerCase();

      if (!currentDraftInvoiceId) return;

      textarea.style.opacity = '0.6';
      const origText = document.getElementById('draft-regenerate').textContent;
      document.getElementById('draft-regenerate').textContent = '⏳ regenerando...';

      const token = localStorage.getItem('casflou_session');
      const apiBaseUrl = localStorage.getItem('casflou_api_url') ||
                        (window.location.hostname === 'localhost' ? 'http://localhost:8790' : window.location.origin);

      try {
        const response = await fetch(apiBaseUrl + '/api/draft?invoice_id=' + currentDraftInvoiceId + '&tone=' + tone, {
          headers: { 'Authorization': 'Bearer ' + token }
        });

        if (!response.ok) throw new Error('Failed to regenerate draft');

        const html = await response.text();
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = html;

        // Find the message in the draft form - it's in a paragraph with specific inline styles
        // Look for the paragraph that comes after "Mensaje propuesto:" label
        const paragraphs = Array.from(tempDiv.querySelectorAll('p'));
        const labelIdx = paragraphs.findIndex(p => p.textContent.includes('Mensaje propuesto'));
        let message = 'No message generated';

        if (labelIdx >= 0 && labelIdx < paragraphs.length - 1) {
          // The message is in the next paragraph after the label
          message = paragraphs[labelIdx + 1]?.textContent?.trim() || 'No message generated';
        }

        if (message && message !== 'No message generated') {
          currentDraftMessage = message;
          textarea.value = message;
        }
      } catch (error) {
        console.error('Error regenerating draft:', error);
        alert('Error al regenerar el mensaje');
      } finally {
        textarea.style.opacity = '1';
        document.getElementById('draft-regenerate').textContent = origText;
      }
    });

    // Send WhatsApp button - uses current textarea content
    document.getElementById('draft-whatsapp-btn')?.addEventListener('click', async () => {
      const textarea = document.getElementById('draft-message-text');
      const message = textarea.value.trim();

      if (!message) {
        alert('Por favor escribe un mensaje');
        return;
      }

      if (!currentDraftWhatsapp) {
        alert('⚠️ Número de WhatsApp no disponible para este cliente');
        return;
      }

      const btn = document.getElementById('draft-whatsapp-btn');
      btn.disabled = true;
      btn.textContent = '📤 Abriendo WhatsApp...';

      const token = localStorage.getItem('casflou_session');
      const apiBaseUrl = localStorage.getItem('casflou_api_url') ||
                        (window.location.hostname === 'localhost' ? 'http://localhost:8790' : window.location.origin);

      try {
        // Record draft was prepared
        await fetch(apiBaseUrl + '/api/draft/send', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            invoice_id: currentDraftInvoiceId,
            message: message,
            tone: document.getElementById('draft-tone-label').textContent.toLowerCase()
          })
        });

        // Open WhatsApp with the message
        const encoded = encodeURIComponent(message);
        const waUrl = 'https://wa.me/' + currentDraftWhatsapp + '?text=' + encoded;
        window.open(waUrl, '_blank');

        // Close modal after opening WhatsApp
        closeDraftModal();
      } catch (error) {
        console.error('Error:', error);
        alert('Error al enviar el mensaje');
        btn.disabled = false;
        btn.textContent = '📱 Enviar por WhatsApp';
      }
    });

    // Close draft modal when clicking outside
    document.getElementById('draft-modal')?.addEventListener('click', (e) => {
      if (e.target.id === 'draft-modal') {
        closeDraftModal();
      }
    });

    // Intercept draft/mensaje button clicks (delegated) - Mobile friendly
    function handleDraftClick(e) {
      const button = e.target.closest('.btn-draft, .btn-mensaje');
      if (!button) return;

      console.log('💬 Mensaje button clicked');
      const invoiceId = button.dataset.invoiceId;
      const debtorId = button.dataset.debtorId;

      if (invoiceId && debtorId) {
        openDraftModal(invoiceId, debtorId);
      } else {
        console.error('⚠️ Could not get invoice ID or debtor ID');
        alert('Error: No se pudo identificar la factura');
      }
    }

    document.addEventListener('click', handleDraftClick, true);
    document.addEventListener('touchend', handleDraftClick, true);

    // ─────── DEBTOR PROFILE LOGIC ─────────
    // Intercept debtor profile button clicks (delegated) - Mobile friendly
    function handleDebtorClick(e) {
      const button = e.target.closest('.btn-debtor');
      if (!button) return;

      const debtorId = button.dataset.debtorId;
      if (debtorId) {
        openDebtorProfile(debtorId);
      } else {
        console.error('⚠️ Could not get debtor ID');
        alert('Error: No se pudo cargar el perfil');
      }
    }

    document.addEventListener('click', handleDebtorClick, true);
    document.addEventListener('touchend', handleDebtorClick, true);

    async function openDebtorProfile(debtorId) {
      if (!debtorId) return;

      try {
        const token = localStorage.getItem('casflou_session');
        const response = await fetch(apiUrl(`/api/client/${debtorId}`), {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (response.ok) {
          const html = await response.text();
          // Find the first queue card and insert the profile into its card-draft area
          const card = document.querySelector('[data-debtor-id]');
          if (card) {
            const profileContainer = document.createElement('div');
            profileContainer.style.marginTop = '1rem';
            profileContainer.innerHTML = html;
            card.closest('.queue-card')?.insertAdjacentElement('afterend', profileContainer);
          }
        }
      } catch (error) {
        console.error('Error loading debtor profile:', error);
        alert('Error loading profile');
      }
    }

    // Close tone modal handlers
    document.getElementById('tone-close-btn')?.addEventListener('click', closeToneModal);

    // Close tone modal when clicking outside
    document.getElementById('tone-modal')?.addEventListener('click', (e) => {
      if (e.target.id === 'tone-modal') {
        closeToneModal();
      }
    });

    // Tone button handlers
    document.querySelectorAll('.tone-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const tone = e.currentTarget.dataset.tone;
        const invoiceId = currentToneDraftInvoiceId;

        if (!invoiceId) return;

        // Load draft with selected tone
        const draftUrl = apiUrl(`/api/draft?invoice_id=${invoiceId}&tone=${tone}`);
        try {
          const token = localStorage.getItem('casflou_session');
          const response = await fetch(draftUrl, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (response.ok) {
            const html = await response.text();
            const card = document.querySelector(`[data-invoice-id='${invoiceId}']`);
            if (card) {
              const draftContainer = card.querySelector('.card-draft');
              draftContainer.innerHTML = html;
              draftContainer.style.display = 'block';
            }
          }
        } catch (error) {
          console.error('Error loading draft:', error);
        }

        closeToneModal();
      });
    });

    // ─────── CARD MENU TOGGLE ─────────
    document.addEventListener('click', (e) => {
      // Toggle card menu
      if (e.target.classList.contains('btn-card-menu')) {
        e.preventDefault();
        const card = e.target.closest('.queue-card');
        const menu = card.querySelector('.card-menu');
        const isVisible = menu.style.display !== 'none';

        // Close all other menus
        document.querySelectorAll('.card-menu').forEach(m => m.style.display = 'none');

        // Toggle this menu
        menu.style.display = isVisible ? 'none' : 'block';
      }

      // Close menu when clicking outside
      if (!e.target.closest('.queue-card')) {
        document.querySelectorAll('.card-menu').forEach(m => m.style.display = 'none');
      }
    });

    // ─────── DRAFT FORM EVENT LISTENERS ─────────
    document.addEventListener('click', (e) => {
      // Send via WhatsApp button
      if (e.target.classList.contains('btn-send-whatsapp')) {
        e.preventDefault();
        const form = e.target.closest('.draft-form');
        const invoiceId = form.dataset.invoiceId;
        const whatsappNumber = form.dataset.whatsapp;
        const message = form.querySelector('.draft-textarea').value;
        const tone = form.querySelector('.tone-select').value;

        if (!whatsappNumber) {
          alert('⚠️ Número de WhatsApp no disponible para este cliente');
          return;
        }

        e.target.disabled = true;
        e.target.textContent = '📤 Abriendo WhatsApp...';

        const token = localStorage.getItem('casflou_session');
        const apiBaseUrl = localStorage.getItem('casflou_api_url') ||
                          (window.location.hostname === 'localhost' ? 'http://localhost:8790' : window.location.origin);

        // Submit draft to record it was prepared
        fetch(apiBaseUrl + '/api/draft/send', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            invoice_id: invoiceId,
            message: message,
            tone: tone
          })
        })
        .then(r => r.json())
        .then(data => {
          if (data.ok) {
            // Open WhatsApp with message
            const encoded = encodeURIComponent(message);
            const waUrl = 'https://wa.me/' + whatsappNumber + '?text=' + encoded;
            window.open(waUrl, '_blank');
            form.remove();
          } else {
            alert('Error: ' + (data.error || 'No se pudo preparar el draft'));
            e.target.disabled = false;
            e.target.textContent = '📱 Enviar por WhatsApp';
          }
        })
        .catch(err => {
          console.error('Error:', err);
          alert('Error de conexión');
          e.target.disabled = false;
          e.target.textContent = '📱 Enviar por WhatsApp';
        });
      }

      // Register only button (save draft without opening WhatsApp)
      if (e.target.classList.contains('btn-register-only')) {
        e.preventDefault();
        const form = e.target.closest('.draft-form');
        const invoiceId = form.dataset.invoiceId;
        const message = form.querySelector('.draft-textarea').value;
        const tone = form.querySelector('.tone-select').value;

        e.target.disabled = true;
        e.target.textContent = '📝 Registrando...';

        const token = localStorage.getItem('casflou_session');
        const apiBaseUrl = localStorage.getItem('casflou_api_url') ||
                          (window.location.hostname === 'localhost' ? 'http://localhost:8790' : window.location.origin);

        fetch(apiBaseUrl + '/api/draft/send', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            invoice_id: invoiceId,
            message: message,
            tone: tone
          })
        })
        .then(r => r.json())
        .then(data => {
          if (data.ok) {
            alert('✓ Draft registrado. Abre Registrar para completar la acción.');
            form.remove();
          } else {
            alert('Error: ' + (data.error || 'No se pudo preparar el draft'));
          }
          e.target.disabled = false;
          e.target.textContent = '📝 Registrar (sin enviar)';
        })
        .catch(err => {
          console.error('Error:', err);
          alert('Error de conexión');
          e.target.disabled = false;
          e.target.textContent = '📝 Registrar (sin enviar)';
        });
      }

      // Cancel draft button
      if (e.target.classList.contains('btn-cancel-draft')) {
        e.preventDefault();
        const form = e.target.closest('.draft-form');
        if (form) form.remove();
      }
    });

    // Handle tone selector change in draft form
    document.addEventListener('change', (e) => {
      if (e.target.classList.contains('tone-select')) {
        const form = e.target.closest('.draft-form');
        const invoiceId = form.dataset.invoiceId;
        const tone = e.target.value;
        const textarea = form.querySelector('.draft-textarea');

        textarea.style.opacity = '0.6';

        const token = localStorage.getItem('casflou_session');
        const apiBaseUrl = localStorage.getItem('casflou_api_url') ||
                          (window.location.hostname === 'localhost' ? 'http://localhost:8790' : window.location.origin);

        fetch(apiBaseUrl + '/api/draft?invoice_id=' + invoiceId + '&tone=' + tone, {
          headers: { 'Authorization': 'Bearer ' + token }
        })
        .then(r => r.text())
        .then(html => {
          const tempDiv = document.createElement('div');
          tempDiv.innerHTML = html;
          const newMessage = tempDiv.querySelector('.draft-textarea').value;
          textarea.value = newMessage;
          textarea.style.opacity = '1';
        })
        .catch(err => {
          console.error('Error updating tone:', err);
          textarea.style.opacity = '1';
        });
      }
    });

    // Load snooze reasons when page loads
    async function loadSnoozeReasons() {
      try {
        const token = localStorage.getItem('casflou_session');
        const reasonsResp = await fetch(apiUrl('/api/snooze-reasons'), {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (reasonsResp.ok) {
          const data = await reasonsResp.json();
          const select = document.getElementById('snooze-reason');
          select.innerHTML = '<option value="">Selecciona un motivo...</option>';
          data.default_reasons.forEach(r => {
            select.innerHTML += `<option value="${r}">${r}</option>`;
          });
          data.custom_reasons.forEach(r => {
            select.innerHTML += `<option value="${r}">${r}</option>`;
          });
          select.innerHTML += '<option value="custom">➕ Añadir nuevo motivo...</option>';
        }
      } catch (error) {
        console.error('Error loading snooze reasons:', error);
      }
    }

    loadSnoozeReasons();

    function openSnoozeModal(invoiceId) {
      console.log('⏸️ Opening snooze modal for invoice:', invoiceId);
      currentSnoozeInvoiceId = invoiceId;
      document.getElementById('snooze-modal').style.display = 'flex';

      // Set default date to 7 days from now
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 7);
      document.getElementById('snooze-date').value = tomorrow.toISOString().split('T')[0];

      // Clear form fields
      document.getElementById('snooze-reason').value = '';
      document.getElementById('snooze-custom-reason').value = '';
      document.getElementById('snooze-reminder').value = '';
      document.getElementById('custom-reason-wrapper').style.display = 'none';
      console.log('✓ Snooze modal opened');
    }

    function closeSnoozeModal() {
      document.getElementById('snooze-modal').style.display = 'none';
      currentSnoozeInvoiceId = null;
    }

    // Open snooze modal when snooze button clicked (delegated) - Mobile friendly
    function handleSnoozeClick(e) {
      const button = e.target.closest('.btn-snooze');
      if (!button) return;

      console.log('⏸️ Snooze button clicked');
      const invoiceId = button.dataset.invoiceId;

      if (invoiceId) {
        openSnoozeModal(invoiceId);
      } else {
        console.error('⚠️ Could not get invoice ID');
        alert('Error: No se pudo identificar la factura');
      }
    }

    document.addEventListener('click', handleSnoozeClick, true);
    document.addEventListener('touchend', handleSnoozeClick, true);

    // Quick snooze buttons (calculate date)
    document.querySelectorAll('.snooze-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const days = parseInt(e.target.dataset.days);
        const futureDate = new Date();
        futureDate.setDate(futureDate.getDate() + days);
        document.getElementById('snooze-date').value = futureDate.toISOString().split('T')[0];
      });
    });

    // Custom reason toggle
    document.getElementById('snooze-reason').addEventListener('change', (e) => {
      if (e.target.value === 'custom') {
        document.getElementById('custom-reason-wrapper').style.display = 'block';
        document.getElementById('snooze-custom-reason').focus();
      } else {
        document.getElementById('custom-reason-wrapper').style.display = 'none';
      }
    });

    // Close modal handlers
    document.getElementById('snooze-close-btn').addEventListener('click', closeSnoozeModal);
    document.getElementById('snooze-cancel-btn').addEventListener('click', closeSnoozeModal);

    // Close modal when clicking outside
    document.getElementById('snooze-modal').addEventListener('click', (e) => {
      if (e.target.id === 'snooze-modal') {
        closeSnoozeModal();
      }
    });

    // Confirm snooze
    document.getElementById('snooze-confirm-btn').addEventListener('click', async () => {
      const reason = document.getElementById('snooze-reason').value;
      const customReason = document.getElementById('snooze-custom-reason').value;
      const finalReason = reason === 'custom' ? customReason : reason;
      const reminderText = document.getElementById('snooze-reminder').value;
      const snoozedUntil = document.getElementById('snooze-date').value;

      if (!finalReason || !snoozedUntil) {
        alert('Por favor completa fecha y motivo');
        return;
      }

      try {
        const token = localStorage.getItem('casflou_session');
        const response = await fetch(apiUrl(`/api/invoices/${currentSnoozeInvoiceId}/snooze`), {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            snoozed_until: snoozedUntil,
            reason: finalReason,
            reminder_text: reminderText || null
          })
        });

        if (response.ok) {
          closeSnoozeModal();
          await loadQueue(); // Reload queue to remove snoozed invoice
        } else {
          alert('Error al posponer la factura');
        }
      } catch (error) {
        console.error('Error snoozing invoice:', error);
        alert('Error de conexión');
      }
    });

    // ─────── LOG ACTION MODAL LOGIC ─────────
    // NOTE: This is OUTSIDE the if(window.htmx) block to ensure it always works
    let currentLogInvoiceId = null;

    function openLogModal(invoiceId) {
      console.log('📋 Opening log modal for invoice:', invoiceId);
      currentLogInvoiceId = invoiceId;
      const modal = document.getElementById('log-modal');
      if (modal) {
        modal.style.display = 'flex';
        // Reset form
        document.getElementById('log-action').value = '';
        document.getElementById('log-outcome').value = '';
        document.getElementById('log-notes').value = '';
        document.getElementById('promised-date-wrapper').style.display = 'none';
        console.log('✓ Log modal opened');
      } else {
        console.error('❌ Log modal not found');
      }
    }

    function closeLogModal() {
      document.getElementById('log-modal').style.display = 'none';
      currentLogInvoiceId = null;
    }

    // Open log modal when btn-log is clicked (delegated) - Mobile friendly
    function handleLogClick(e) {
      const button = e.target.closest('.btn-log');
      if (!button) return;

      console.log('📝 Registrar acción button clicked');
      const card = button.closest('.queue-card');
      const invoiceId = card?.dataset?.invoiceId;

      if (invoiceId) {
        openLogModal(invoiceId);
      } else {
        console.error('⚠️ Could not get invoice ID');
        alert('Error: No se pudo identificar la factura');
      }
    }

    document.addEventListener('click', handleLogClick, true);
    document.addEventListener('touchend', handleLogClick, true);

    // Close log modal handlers
    document.getElementById('log-close-btn')?.addEventListener('click', closeLogModal);
    document.getElementById('log-cancel-btn')?.addEventListener('click', closeLogModal);

    // Close log modal when clicking outside
    document.getElementById('log-modal')?.addEventListener('click', (e) => {
      if (e.target.id === 'log-modal') {
        closeLogModal();
      }
    });

    // Show promised date field when outcome is PROMISE_GIVEN
    document.getElementById('log-outcome')?.addEventListener('change', (e) => {
      const isPromise = e.target.value === 'PROMISE_GIVEN';
      document.getElementById('promised-date-wrapper').style.display = isPromise ? 'block' : 'none';
      if (isPromise) {
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        document.getElementById('log-promised-date').value = tomorrow.toISOString().split('T')[0];
      }
    });

    // Confirm log action
    document.getElementById('log-confirm-btn')?.addEventListener('click', async () => {
      const action = document.getElementById('log-action').value;
      const outcome = document.getElementById('log-outcome').value;
      const notes = document.getElementById('log-notes').value;
      const promisedDate = outcome === 'PROMISE_GIVEN'
        ? document.getElementById('log-promised-date').value
        : null;

      if (!action || !outcome) {
        alert('Por favor completa tipo de contacto y resultado');
        return;
      }

      if (outcome === 'PROMISE_GIVEN' && !promisedDate) {
        alert('Por favor ingresa la fecha prometida');
        return;
      }

      try {
        const token = localStorage.getItem('casflou_session');
        const card = document.querySelector(`[data-invoice-id='${currentLogInvoiceId}']`);
        const debtorId = card?.dataset.debtorId;

        const response = await fetch(apiUrl('/api/log'), {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            invoice_id: currentLogInvoiceId,
            debtor_id: debtorId,
            action_type: action,
            outcome: outcome,
            promised_date: promisedDate,
            notes: notes || null
          })
        });

        if (response.ok) {
          const result = await response.json();
          closeLogModal();

          // Reload queue and auto-advance
          await loadQueue();
          if (result.next_invoice_id) {
            setTimeout(() => {
              const nextCard = document.querySelector(`[data-invoice-id='${result.next_invoice_id}']`);
              if (nextCard) {
                nextCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                nextCard.style.outline = '3px solid #0066cc';
                setTimeout(() => {
                  nextCard.style.outline = 'none';
                }, 2000);
              }
            }, 300);
          }
        } else {
          const error = await response.json();
          alert('Error: ' + (error.error || 'No se pudo registrar la acción'));
        }
      } catch (error) {
        console.error('Error logging action:', error);
        alert('Error de conexión');
      }
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      const token = localStorage.getItem('casflou_session');
      const logoutUrl = apiUrl('/api/auth/logout');

      await fetch(logoutUrl, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${token}`
        }
      }).catch(() => {});

      localStorage.removeItem('casflou_session');
      localStorage.removeItem('casflou_user');
      localStorage.removeItem('casflou_api_url');
      window.location.href = '/login.html';
    });

    // Register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }

    // Calculate total from rendered cards
    function updateTotal() {
      const cards = document.querySelectorAll('.queue-card');
      let total = 0;
      cards.forEach(card => {
        const amountText = card.querySelector('.card-amount');
        if (amountText) {
          // Match format: "2.500,00 €" (number with period thousands separator and comma decimal)
          const match = amountText.textContent.match(/([\d.]+,\d{2})\s€/);
          if (match) {
            // Convert "2.500,00" to 2500.00 by removing periods and replacing comma with period
            const normalized = match[1].replace(/\./g, '').replace(',', '.');
            total += parseFloat(normalized);
          }
        }
      });
      const totalEl = document.getElementById('total');
      if (totalEl) {
        // Format: "7.200,00 €" (thousands separator: period, decimal separator: comma)
        const formatted = (Math.round(total * 100) / 100)
          .toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        totalEl.textContent = formatted + ' €';
      }
    }

    // Log environment on load
    console.log(`🌍 Queue loaded with: ${config.name} (${config.description})`);
  </script>
</body>
</html>
