<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CasFlou - Cola del Día</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0066cc">
</head>
<body>
  <header class="app-header">
    <h1>Cola del Día</h1>
    <span class="total-outstanding" id="total">€0</span>
    <div style="display: flex; gap: 0.5rem; align-items: center;">
      <a href="/dashboard" class="icon-btn" title="Panel de control">📊</a>
      <a href="/settings" class="icon-btn" title="Configuración">⚙️</a>
      <span id="env-badge" style="font-size: 0.7rem; padding: 2px 6px; background: #eee; border-radius: 3px; color: #666;"></span>
      <button class="icon-btn" id="logout-btn" title="Cerrar sesión">🚪</button>
    </div>
  </header>

  <div id="queue-container">
    <div id="loading" class="skeleton-list htmx-indicator">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>
  </div>

  <!-- Tone Selector Modal -->
  <div id="tone-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>🎯 Selecciona el tono del mensaje</h3>
        <button class="modal-close" id="tone-close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <p style="margin-bottom: 1rem; color: #666;">Elige cómo quieres que suene el mensaje:</p>
        <div class="tone-options">
          <button class="tone-btn" data-tone="cordial">
            <div class="tone-icon">😊</div>
            <div class="tone-name">Cordial</div>
            <div class="tone-desc">Amable y personal</div>
            <small style="display:block; margin-top:0.25rem;">Ej: "Esperamos recibir tu pago. ¡Gracias!"</small>
          </button>
          <button class="tone-btn" data-tone="balanced">
            <div class="tone-icon">📋</div>
            <div class="tone-name">Equilibrado</div>
            <div class="tone-desc">Profesional y claro</div>
            <small style="display:block; margin-top:0.25rem;">Ej: "Solicitamos el pago de la factura..."</small>
          </button>
          <button class="tone-btn" data-tone="formal">
            <div class="tone-icon">⚖️</div>
            <div class="tone-name">Formal</div>
            <div class="tone-desc">Serio y urgente</div>
            <small style="display:block; margin-top:0.25rem;">Ej: "Requerimos el pago inmediato..."</small>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Snooze Modal -->
  <div id="snooze-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>⏸️ Posponer esta factura</h3>
        <button class="modal-close" id="snooze-close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <!-- Quick snooze buttons -->
        <div class="snooze-quick">
          <p style="margin: 0 0 0.5rem 0; font-size: 0.875rem; color: #666;">Opción rápida:</p>
          <button class="snooze-btn" data-days="7">1 Semana</button>
          <button class="snooze-btn" data-days="14">2 Semanas</button>
          <button class="snooze-btn" data-days="30">1 Mes</button>
        </div>

        <!-- Or use date picker -->
        <div class="form-group">
          <label for="snooze-date">O elige una fecha:</label>
          <input type="date" id="snooze-date" class="form-input" />
        </div>

        <!-- Reason dropdown -->
        <div class="form-group">
          <label for="snooze-reason">Motivo (obligatorio):</label>
          <select id="snooze-reason" class="form-input">
            <option value="">Selecciona un motivo...</option>
          </select>
        </div>

        <!-- Custom reason input (hidden by default) -->
        <div class="form-group" id="custom-reason-wrapper" style="display: none;">
          <label for="snooze-custom-reason">Nuevo motivo:</label>
          <input type="text" id="snooze-custom-reason" class="form-input" placeholder="Describe el motivo..." />
        </div>

        <!-- Reminder text -->
        <div class="form-group">
          <label for="snooze-reminder">Nota para el seguimiento (opcional):</label>
          <textarea id="snooze-reminder" class="form-input" rows="2" placeholder="Ej: Llamar al tesorero el lunes..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="snooze-cancel-btn">Cancelar</button>
        <button class="btn-primary" id="snooze-confirm-btn">Posponer</button>
      </div>
    </div>
  </div>

  <!-- Log Action Modal -->
  <div id="log-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>📝 Registrar acción de contacto</h3>
        <button class="modal-close" id="log-close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <!-- Action Type -->
        <div class="form-group">
          <label for="log-action">Tipo de contacto:</label>
          <select id="log-action" class="form-input">
            <option value="">Selecciona...</option>
            <option value="CALL">📞 Llamada telefónica</option>
            <option value="EMAIL">📧 Email</option>
            <option value="WHATSAPP">💬 WhatsApp</option>
            <option value="SMS">📱 SMS</option>
            <option value="VISIT">🏢 Visita en persona</option>
            <option value="OTHER">📌 Otro</option>
          </select>
        </div>

        <!-- Outcome -->
        <div class="form-group">
          <label for="log-outcome">Resultado:</label>
          <select id="log-outcome" class="form-input">
            <option value="">Selecciona...</option>
            <option value="PROMISE_GIVEN">✅ Promesa de pago recibida</option>
            <option value="PAYMENT_RECEIVED">💰 Pago recibido</option>
            <option value="NO_RESPONSE">🚫 Sin respuesta</option>
            <option value="PROMISED_BROKEN">⚠️ Promesa rota</option>
            <option value="PARTIAL_PAYMENT">💵 Pago parcial</option>
            <option value="OTHER">📌 Otro</option>
          </select>
        </div>

        <!-- Promised Date (shown only if outcome is PROMISE_GIVEN) -->
        <div class="form-group" id="promised-date-wrapper" style="display: none;">
          <label for="log-promised-date">Fecha prometida (obligatorio):</label>
          <input type="date" id="log-promised-date" class="form-input" />
        </div>

        <!-- Notes -->
        <div class="form-group">
          <label for="log-notes">Notas (opcional):</label>
          <textarea id="log-notes" class="form-input" rows="3" placeholder="Ej: Cliente dice que pagará cuando cobre de su cliente..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="log-cancel-btn">Cancelar</button>
        <button class="btn-primary" id="log-confirm-btn">Registrar</button>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <script>
    // Auth guard
    if (!localStorage.getItem('casflou_session')) {
      window.location.href = '/login.html';
    }

    // Load saved environment preference
    const savedEnv = localStorage.getItem('casflou-env');
    if (savedEnv && (savedEnv === 'development' || savedEnv === 'production')) {
      ENV.ACTIVE = savedEnv;
    }

    // Display current environment
    const config = getConfig();
    document.getElementById('env-badge').textContent = `🌍 ${config.name}`;

    // Configure HTMX before using it
    if (window.htmx) {
      htmx.config.defaultIndicatorStyle = 'spinner';
      htmx.config.refreshOnHistoryMiss = true;

      // Configure HTMX to add auth headers
      document.addEventListener('htmx:configRequest', (event) => {
        event.detail.headers['Authorization'] = `Bearer ${localStorage.getItem('casflou_session')}`;
      });

      // Handle log response for auto-advance
      document.addEventListener('htmx:afterRequest', (event) => {
        if (event.detail.xhr.responseURL.includes('/api/log')) {
          try {
            const response = JSON.parse(event.detail.xhr.responseText);
            if (response.ok && response.next_invoice_id) {
              // Auto-scroll to next invoice card after a brief delay
              setTimeout(() => {
                const nextCard = document.querySelector(`[data-invoice-id='${response.next_invoice_id}']`);
                if (nextCard) {
                  nextCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                  nextCard.style.outline = '3px solid #0066cc';
                  setTimeout(() => {
                    nextCard.style.outline = 'none';
                  }, 2000);
                }
              }, 300);
            }
          } catch (e) {
            // Not JSON, ignore
          }
        }
      });

      // Set up queue URL - use fetch endpoint instead of htmx path
      const queueUrl = apiUrl('/api/queue');
      console.log('Queue URL:', queueUrl);

      // Replace hx-get with custom fetch on load
      const queueContainer = document.getElementById('queue-container');
      queueContainer.removeAttribute('hx-get');

      // Load queue data immediately
      async function loadQueue() {
        try {
          const token = localStorage.getItem('casflou_session');
          const response = await fetch(queueUrl, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (response.ok) {
            const html = await response.text();
            queueContainer.innerHTML = html;
            updateTotal();
          }
        } catch (error) {
          console.error('Queue load error:', error);
          queueContainer.innerHTML = '<div style="padding: 1rem; color: red;">Error loading queue</div>';
        }
      }

      // Initial load
      loadQueue();

      // Reload every 30 seconds
      setInterval(loadQueue, 30000);

      // Snooze modal logic
      let currentSnoozeInvoiceId = null;

      // ─────── TONE SELECTOR LOGIC ─────────
      let currentToneDraftInvoiceId = null;

      // Intercept draft button clicks (delegated)
      document.addEventListener('click', (e) => {
        if (e.target.classList.contains('btn-draft')) {
          e.preventDefault();
          const invoiceId = e.target.closest('.queue-card').dataset.invoiceId;
          openToneModal(invoiceId);
        }
      });

      // ─────── DEBTOR PROFILE LOGIC ─────────
      // Intercept debtor profile button clicks (delegated)
      document.addEventListener('click', (e) => {
        if (e.target.classList.contains('btn-debtor')) {
          e.preventDefault();
          const debtorId = e.target.dataset.debtorId;
          openDebtorProfile(debtorId);
        }
      });

      async function openDebtorProfile(debtorId) {
        if (!debtorId) return;

        try {
          const token = localStorage.getItem('casflou_session');
          const response = await fetch(apiUrl(`/api/client/${debtorId}`), {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (response.ok) {
            const html = await response.text();
            // Find the first queue card and insert the profile into its card-draft area
            const card = document.querySelector('[data-debtor-id]');
            if (card) {
              const profileContainer = document.createElement('div');
              profileContainer.style.marginTop = '1rem';
              profileContainer.innerHTML = html;
              card.closest('.queue-card')?.insertAdjacentElement('afterend', profileContainer);
            }
          }
        } catch (error) {
          console.error('Error loading debtor profile:', error);
          alert('Error loading profile');
        }
      }

      function openToneModal(invoiceId) {
        currentToneDraftInvoiceId = invoiceId;
        document.getElementById('tone-modal').style.display = 'flex';
      }

      function closeToneModal() {
        document.getElementById('tone-modal').style.display = 'none';
        currentToneDraftInvoiceId = null;
      }

      // Close tone modal handlers
      document.getElementById('tone-close-btn')?.addEventListener('click', closeToneModal);

      // Close tone modal when clicking outside
      document.getElementById('tone-modal')?.addEventListener('click', (e) => {
        if (e.target.id === 'tone-modal') {
          closeToneModal();
        }
      });

      // Tone button handlers
      document.querySelectorAll('.tone-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const tone = e.currentTarget.dataset.tone;
          const invoiceId = currentToneDraftInvoiceId;

          if (!invoiceId) return;

          // Load draft with selected tone
          const draftUrl = apiUrl(`/api/draft?invoice_id=${invoiceId}&tone=${tone}`);
          try {
            const token = localStorage.getItem('casflou_session');
            const response = await fetch(draftUrl, {
              headers: { 'Authorization': `Bearer ${token}` }
            });
            if (response.ok) {
              const html = await response.text();
              const card = document.querySelector(`[data-invoice-id='${invoiceId}']`);
              if (card) {
                const draftContainer = card.querySelector('.card-draft');
                draftContainer.innerHTML = html;
                draftContainer.style.display = 'block';
              }
            }
          } catch (error) {
            console.error('Error loading draft:', error);
          }

          closeToneModal();
        });
      });

      // Load snooze reasons when page loads
      async function loadSnoozeReasons() {
        try {
          const token = localStorage.getItem('casflou_session');
          const reasonsResp = await fetch(apiUrl('/api/snooze-reasons'), {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (reasonsResp.ok) {
            const data = await reasonsResp.json();
            const select = document.getElementById('snooze-reason');
            select.innerHTML = '<option value="">Selecciona un motivo...</option>';
            data.default_reasons.forEach(r => {
              select.innerHTML += `<option value="${r}">${r}</option>`;
            });
            data.custom_reasons.forEach(r => {
              select.innerHTML += `<option value="${r}">${r}</option>`;
            });
            select.innerHTML += '<option value="custom">➕ Añadir nuevo motivo...</option>';
          }
        } catch (error) {
          console.error('Error loading snooze reasons:', error);
        }
      }

      loadSnoozeReasons();

      // Open snooze modal when snooze button clicked (delegated)
      document.addEventListener('click', (e) => {
        if (e.target.classList.contains('btn-snooze')) {
          const invoiceId = e.target.dataset.invoiceId;
          openSnoozeModal(invoiceId);
        }
      });

      function openSnoozeModal(invoiceId) {
        currentSnoozeInvoiceId = invoiceId;
        document.getElementById('snooze-modal').style.display = 'flex';

        // Set default date to 7 days from now
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 7);
        document.getElementById('snooze-date').value = tomorrow.toISOString().split('T')[0];

        // Clear form fields
        document.getElementById('snooze-reason').value = '';
        document.getElementById('snooze-custom-reason').value = '';
        document.getElementById('snooze-reminder').value = '';
        document.getElementById('custom-reason-wrapper').style.display = 'none';
      }

      // Quick snooze buttons (calculate date)
      document.querySelectorAll('.snooze-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const days = parseInt(e.target.dataset.days);
          const futureDate = new Date();
          futureDate.setDate(futureDate.getDate() + days);
          document.getElementById('snooze-date').value = futureDate.toISOString().split('T')[0];
        });
      });

      // Custom reason toggle
      document.getElementById('snooze-reason').addEventListener('change', (e) => {
        if (e.target.value === 'custom') {
          document.getElementById('custom-reason-wrapper').style.display = 'block';
          document.getElementById('snooze-custom-reason').focus();
        } else {
          document.getElementById('custom-reason-wrapper').style.display = 'none';
        }
      });

      // Close modal handlers
      document.getElementById('snooze-close-btn').addEventListener('click', closeSnoozeModal);
      document.getElementById('snooze-cancel-btn').addEventListener('click', closeSnoozeModal);

      function closeSnoozeModal() {
        document.getElementById('snooze-modal').style.display = 'none';
        currentSnoozeInvoiceId = null;
      }

      // Close modal when clicking outside
      document.getElementById('snooze-modal').addEventListener('click', (e) => {
        if (e.target.id === 'snooze-modal') {
          closeSnoozeModal();
        }
      });

      // Confirm snooze
      document.getElementById('snooze-confirm-btn').addEventListener('click', async () => {
        const reason = document.getElementById('snooze-reason').value;
        const customReason = document.getElementById('snooze-custom-reason').value;
        const finalReason = reason === 'custom' ? customReason : reason;
        const reminderText = document.getElementById('snooze-reminder').value;
        const snoozedUntil = document.getElementById('snooze-date').value;

        if (!finalReason || !snoozedUntil) {
          alert('Por favor completa fecha y motivo');
          return;
        }

        try {
          const token = localStorage.getItem('casflou_session');
          const response = await fetch(apiUrl(`/api/invoices/${currentSnoozeInvoiceId}/snooze`), {
            method: 'PUT',
            headers: {
              'Authorization': `Bearer ${token}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              snoozed_until: snoozedUntil,
              reason: finalReason,
              reminder_text: reminderText || null
            })
          });

          if (response.ok) {
            closeSnoozeModal();
            await loadQueue(); // Reload queue to remove snoozed invoice
          } else {
            alert('Error al posponer la factura');
          }
        } catch (error) {
          console.error('Error snoozing invoice:', error);
          alert('Error de conexión');
        }
      });
    } else {
      console.error('htmx not loaded');
    }

    // ─────── LOG ACTION MODAL LOGIC ─────────
    let currentLogInvoiceId = null;

    // Open log modal when btn-log is clicked (delegated)
    document.addEventListener('click', (e) => {
      if (e.target.classList.contains('btn-log')) {
        const invoiceId = e.target.closest('.queue-card').dataset.invoiceId;
        openLogModal(invoiceId);
      }
    });

    function openLogModal(invoiceId) {
      currentLogInvoiceId = invoiceId;
      document.getElementById('log-modal').style.display = 'flex';

      // Reset form
      document.getElementById('log-action').value = '';
      document.getElementById('log-outcome').value = '';
      document.getElementById('log-notes').value = '';
      document.getElementById('promised-date-wrapper').style.display = 'none';
    }

    function closeLogModal() {
      document.getElementById('log-modal').style.display = 'none';
      currentLogInvoiceId = null;
    }

    // Close log modal handlers
    document.getElementById('log-close-btn')?.addEventListener('click', closeLogModal);
    document.getElementById('log-cancel-btn')?.addEventListener('click', closeLogModal);

    // Close log modal when clicking outside
    document.getElementById('log-modal')?.addEventListener('click', (e) => {
      if (e.target.id === 'log-modal') {
        closeLogModal();
      }
    });

    // Show promised date field when outcome is PROMISE_GIVEN
    document.getElementById('log-outcome')?.addEventListener('change', (e) => {
      const isPromise = e.target.value === 'PROMISE_GIVEN';
      document.getElementById('promised-date-wrapper').style.display = isPromise ? 'block' : 'none';
      if (isPromise) {
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        document.getElementById('log-promised-date').value = tomorrow.toISOString().split('T')[0];
      }
    });

    // Confirm log action
    document.getElementById('log-confirm-btn')?.addEventListener('click', async () => {
      const action = document.getElementById('log-action').value;
      const outcome = document.getElementById('log-outcome').value;
      const notes = document.getElementById('log-notes').value;
      const promisedDate = outcome === 'PROMISE_GIVEN'
        ? document.getElementById('log-promised-date').value
        : null;

      if (!action || !outcome) {
        alert('Por favor completa tipo de contacto y resultado');
        return;
      }

      if (outcome === 'PROMISE_GIVEN' && !promisedDate) {
        alert('Por favor ingresa la fecha prometida');
        return;
      }

      try {
        const token = localStorage.getItem('casflou_session');
        const card = document.querySelector(`[data-invoice-id='${currentLogInvoiceId}']`);
        const debtorId = card?.dataset.debtorId;

        const response = await fetch(apiUrl('/api/log'), {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            invoice_id: currentLogInvoiceId,
            debtor_id: debtorId,
            action_type: action,
            outcome: outcome,
            promised_date: promisedDate,
            notes: notes || null
          })
        });

        if (response.ok) {
          const result = await response.json();
          closeLogModal();

          // Reload queue and auto-advance
          await loadQueue();
          if (result.next_invoice_id) {
            setTimeout(() => {
              const nextCard = document.querySelector(`[data-invoice-id='${result.next_invoice_id}']`);
              if (nextCard) {
                nextCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                nextCard.style.outline = '3px solid #0066cc';
                setTimeout(() => {
                  nextCard.style.outline = 'none';
                }, 2000);
              }
            }, 300);
          }
        } else {
          const error = await response.json();
          alert('Error: ' + (error.error || 'No se pudo registrar la acción'));
        }
      } catch (error) {
        console.error('Error logging action:', error);
        alert('Error de conexión');
      }
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      const token = localStorage.getItem('casflou_session');
      const logoutUrl = apiUrl('/api/auth/logout');

      await fetch(logoutUrl, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${token}`
        }
      }).catch(() => {});

      localStorage.removeItem('casflou_session');
      localStorage.removeItem('casflou_user');
      window.location.href = '/login.html';
    });

    // Register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }

    // Calculate total from rendered cards
    function updateTotal() {
      const cards = document.querySelectorAll('.queue-card');
      let total = 0;
      cards.forEach(card => {
        const amountText = card.querySelector('.card-details p:nth-child(1)');
        if (amountText) {
          const match = amountText.textContent.match(/€([\d.]+)/);
          if (match) total += parseFloat(match[1].replace('.', ''));
        }
      });
      const totalEl = document.getElementById('total');
      if (totalEl) {
        totalEl.textContent = '€' + total.toLocaleString('es-ES', {minimumFractionDigits: 0});
      }
    }

    // Log environment on load
    console.log(`🌍 Queue loaded with: ${config.name} (${config.description})`);
  </script>
</body>
</html>
