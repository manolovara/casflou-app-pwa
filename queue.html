<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CasFlou - Cola del Día</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0066cc">
</head>
<body>
  <header class="app-header">
    <h1>Cola del Día</h1>
    <span class="total-outstanding" id="total">€0</span>
    <div style="display: flex; gap: 0.5rem; align-items: center;">
      <span id="env-badge" style="font-size: 0.7rem; padding: 2px 6px; background: #eee; border-radius: 3px; color: #666;"></span>
      <button class="icon-btn" id="logout-btn" title="Cerrar sesión">🚪</button>
    </div>
  </header>

  <div id="queue-container"
       hx-trigger="load, every 30s"
       hx-swap="innerHTML"
       hx-indicator="#loading">

    <div id="loading" class="skeleton-list htmx-indicator">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/auth.js"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <script>
    // Auth guard
    if (!localStorage.getItem('casflou_session')) {
      window.location.href = '/login.html';
    }

    // Load saved environment preference
    const savedEnv = localStorage.getItem('casflou-env');
    if (savedEnv && (savedEnv === 'development' || savedEnv === 'production')) {
      ENV.ACTIVE = savedEnv;
    }

    // Display current environment
    const config = getConfig();
    document.getElementById('env-badge').textContent = `🌍 ${config.name}`;

    // Configure HTMX to add auth headers and allow cross-origin requests
    document.addEventListener('htmx:configRequest', (event) => {
      event.detail.headers['Authorization'] = `Bearer ${localStorage.getItem('casflou_session')}`;
    });

    // HTMX config - must run after htmx loads
    if (window.htmx) {
      htmx.config.defaultIndicatorStyle = 'spinner';
      htmx.config.refreshOnHistoryMiss = true;

      // Set up dynamic queue URL using config
      const queueUrl = apiUrl('/api/queue');
      console.log('Queue URL:', queueUrl);
      document.getElementById('queue-container').setAttribute('hx-get', queueUrl);
    } else {
      console.error('htmx not loaded');
    }

    // Logout
    document.getElementById('logout-btn').addEventListener('click', async () => {
      const token = localStorage.getItem('casflou_session');
      const logoutUrl = apiUrl('/api/auth/logout');

      await fetch(logoutUrl, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${token}`
        }
      }).catch(() => {});

      localStorage.removeItem('casflou_session');
      localStorage.removeItem('casflou_user');
      window.location.href = '/login.html';
    });

    // Register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }

    // Calculate total from rendered cards
    function updateTotal() {
      const cards = document.querySelectorAll('.queue-card');
      let total = 0;
      cards.forEach(card => {
        const amountText = card.querySelector('.card-details p:nth-child(1)');
        if (amountText) {
          const match = amountText.textContent.match(/€([\d.]+)/);
          if (match) total += parseFloat(match[1].replace('.', ''));
        }
      });
      const totalEl = document.getElementById('total');
      if (totalEl) {
        totalEl.textContent = '€' + total.toLocaleString('es-ES', {minimumFractionDigits: 0});
      }
    }

    // Watch for htmx swap completion
    document.body.addEventListener('htmx:afterSettle', updateTotal);
    updateTotal(); // Initial

    // Log environment on load
    console.log(`🌍 Queue loaded with: ${config.name} (${config.description})`);
  </script>
</body>
</html>
