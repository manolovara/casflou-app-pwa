<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CasFlou - Acceder</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h1>CasFlou</h1>
      <p>Tu Sistema Operativo de Caja</p>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="tu@empresa.com"
            required
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="btn-primary">
          Acceder
        </button>

        <div id="error-message" style="display: none; color: var(--danger); margin-top: 1rem; text-align: center; font-size: 0.875rem;"></div>
      </form>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('error-message');

      try {
        //const response = await fetch('/api/auth/login', {
        const response = await fetch('http://localhost:8790/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });

        const data = await response.json();

        if (!response.ok) {
          errorDiv.textContent = data.error || 'Error al acceder';
          errorDiv.style.display = 'block';
          return;
        }

        // Store token and redirect
        localStorage.setItem('casflou_session', data.token);
        localStorage.setItem('casflou_user', JSON.stringify(data.user));
        window.location.href = '/queue.html';
      } catch (error) {
        errorDiv.textContent = 'Error de conexión. Intenta de nuevo.';
        errorDiv.style.display = 'block';
        console.error('Login error:', error);
      }
    });
  </script>
</body>
</html>
