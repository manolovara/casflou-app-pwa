<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CasFlou - Acceder</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h1>CasFlou</h1>
      <p>Tu Sistema Operativo de Caja</p>

      <!-- Environment indicator -->
      <div id="env-indicator" style="text-align: center; margin-bottom: 1rem; padding: 0.5rem; background: #f0f0f0; border-radius: 4px; font-size: 0.75rem; color: #666;">
        Loading environment...
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="tu@empresa.com"
            value="carlos@test.local"
            required
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            value="test"
            required
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="btn-primary">
          Acceder
        </button>

        <div id="error-message" style="display: none; color: var(--danger); margin-top: 1rem; text-align: center; font-size: 0.875rem;"></div>
      </form>

      <!-- Environment switcher (dev only) -->
      <div id="env-switcher" style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #eee; display: none;">
        <p style="font-size: 0.75rem; color: #999; margin-bottom: 0.5rem;">🔧 Dev only - Switch environment:</p>
        <div style="display: flex; gap: 0.5rem;">
          <button type="button" id="btn-dev" style="flex: 1; padding: 0.5rem; font-size: 0.75rem; background: #f0f0f0; border: 1px solid #ddd; border-radius: 4px; cursor: pointer;">
            Dev (localhost:8790)
          </button>
          <button type="button" id="btn-prod" style="flex: 1; padding: 0.5rem; font-size: 0.75rem; background: #f0f0f0; border: 1px solid #ddd; border-radius: 4px; cursor: pointer;">
            Prod (manolo-vara)
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    // Display current environment
    function updateEnvDisplay() {
      const config = getConfig();
      const indicator = document.getElementById('env-indicator');
      indicator.textContent = `🌍 ${config.name}: ${config.description}`;

      // Show switcher if in development
      if (config.env === 'development') {
        document.getElementById('env-switcher').style.display = 'block';
      }
    }

    updateEnvDisplay();

    // Environment switcher buttons (dev only)
    document.getElementById('btn-dev').addEventListener('click', () => {
      ENV.ACTIVE = 'development';
      localStorage.setItem('casflou-env', 'development');
      updateEnvDisplay();
      alert('Switched to Development. Refresh to apply.');
    });

    document.getElementById('btn-prod').addEventListener('click', () => {
      ENV.ACTIVE = 'production';
      localStorage.setItem('casflou-env', 'production');
      updateEnvDisplay();
      alert('Switched to Production. Refresh to apply.');
    });

    // Load saved environment preference
    const savedEnv = localStorage.getItem('casflou-env');
    if (savedEnv && (savedEnv === 'development' || savedEnv === 'production')) {
      ENV.ACTIVE = savedEnv;
      updateEnvDisplay();
    }

    // Handle login form submission
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('error-message');
      const submitBtn = e.target.querySelector('button[type="submit"]');

      try {
        const loginUrl = apiUrl('/api/auth/login');
        console.log(`🔐 Logging in to: ${loginUrl}`);

        const response = await fetch(loginUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });

        const data = await response.json();

        if (!response.ok) {
          errorDiv.textContent = data.error || 'Error al acceder';
          errorDiv.style.display = 'block';
          submitBtn.disabled = false;
          return;
        }

        // Store token, API URL, and redirect
        localStorage.setItem('casflou_session', data.token);
        localStorage.setItem('casflou_user', JSON.stringify(data.user));
        localStorage.setItem('casflou_api_url', getConfig().workerUrl);
        window.location.href = '/queue';
      } catch (error) {
        errorDiv.textContent = 'Error de conexión. Intenta de nuevo.';
        errorDiv.style.display = 'block';
        console.error('Login error:', error);
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
